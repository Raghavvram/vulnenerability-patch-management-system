name: CI

on:
  push:
    branches: [ main, master, develop, errorfree ]
  pull_request:
    branches: [ main, master, develop, errorfree ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: pip install uv
      - name: Create venv and install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Run test suite
        run: |
          uv run pytest -v
